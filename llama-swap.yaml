# llama-swap: single OpenAI-compatible entry point for the DGX Spark.
#
# Staged config for the cutover to Qwen3.8-Flash-Next as the only served model.
# Swap it in with:  cp llama-swap.qwen38.yaml llama-swap.yaml
# (llama-swap watches the file and reloads within ~2s. A reload is NOT free:
# it stops every model process and the preload hook starts the model again,
# so ANY edit to this file on the host costs a full ~13 minute model load.
# See README -> Operations -> Keys and rotation before touching it.)
#
# Why llama-swap is still here with one model: it owns the bearer token, the
# 0.0.0.0:9292 surface every client and Open WebUI already points at, and the
# process lifecycle. Dropping it would mean reconfiguring all of those.

# Qwen3.8 loads ~75 GiB of weights on first boot: 8-13 minutes.
healthCheckTimeout: 1800
logLevel: info
startPort: 10001

# Request-profile aliases (below) are listed in /v1/models so clients that
# validate their configured model name against the listing accept them.
includeAliasesInList: true

# Bearer tokens: one key per consumer, so one consumer can be revoked without
# touching the others. Required on every inference, UI and admin endpoint;
# only the /health liveness probe answers without one.
#
# Values NEVER go in this file. Each entry is an env macro resolved from the
# llama-swap process environment, which systemd fills from
# ~/ai-stack/secrets/api-key.env (see secrets.env.example).
#
# Consumer naming convention - names only, the name is what you revoke by:
#   agent-<host>      coding agents on one operator workstation
#   dashboard-<host>  one always-on dashboard / kiosk client
#   webui             the Open WebUI container on this box
# The variable is the name upper-cased with "-" as "_" and an LLM_KEY_ prefix:
#   agent-host1 -> LLM_KEY_AGENT_HOST1. One line per consumer; add a line (and
#   a variable) per extra host rather than sharing a key between hosts.
#
# Facts about llama-swap that shape this list (sources in the README):
#   - apiKeys is a flat list of strings. Keys have no names or labels inside
#     llama-swap, all keys are equivalent, and nothing is logged or counted
#     per key. The names above exist only in this file and the secrets file.
#   - Every variable referenced here MUST be set and non-empty in the
#     environment, or llama-swap refuses to load the config (at startup: it
#     does not start; on a reload: it keeps the old config and logs a warning).
#     Fill the secrets file BEFORE installing this file.
#   - The environment is read when the process starts. A new or changed value
#     only takes effect on a service restart, and a restart reloads the model.
#   - Do not write an env macro inside a comment: llama-swap releases before
#     v188 expanded macros in comments too.
#
# LLM_KEY_STANDBY is a pre-issued spare that no consumer holds. It lets a
# rotation hand the consumer a key that is ALREADY accepted (no restart), so
# the only model reload is the one that retires the old key.
apiKeys:
  - "${env.LLM_API_KEY}"   # LEGACY shared key - kept valid during migration; remove at a later planned reload
  - "${env.LLM_KEY_AGENT_HOST1}"
  - "${env.LLM_KEY_DASHBOARD_HOST1}"
  - "${env.LLM_KEY_DASHBOARD_HOST2}"
  - "${env.LLM_KEY_CLUSTER_ASSISTANT}"
  - "${env.LLM_KEY_SANDBOX_AGENT}"
  - "${env.LLM_KEY_WEBUI}"
  - "${env.LLM_KEY_STANDBY}"

models:
  "qwen3.8-flash-next":
    name: "Qwen3.8-Flash-Next"
    description: "125B main + 51B n-gram, 6B active, on vLLM. Coding agents."
    # ${env.HOME} is llama-swap's environment-variable macro (same mechanism as
    # the apiKeys entry above); it keeps an absolute home path out of this file.
    cmd: ${env.HOME}/ai-stack/bin/run-qwen38.sh ${PORT}
    cmdStop: docker stop qwen38-flash
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    # Never unload on idle. The old 60s default was fine for a model that
    # reloads in 42s; here it would throw away 13 minutes of loading every
    # time you stepped away from the keyboard.
    unloadTimeout: 0
    # Match vLLM's 8 running sequences. llama-swap's default of 10 let requests
    # 9 and 10 through to sit in vLLM's queue for 20-40s with no feedback; at 8
    # the 9th gets an immediate 429 it can retry. The 8 is inferred from
    # benchmark queueing (docs/performance-assessment.md), not read from
    # serve.sh - if --max-num-seqs there differs, change this to match.
    concurrencyLimit: 8
    # Scheduler tuning (issue #3), passed to the recipe's serve.sh through its EXTRA
    # knob so the vendored script stays untouched. Chosen by measurement - see
    # docs/mixed-workload-plan.md. Changing this line is a ~13-minute model reload.
    env:
      - "EXTRA=--scheduling-policy priority --long-prefill-token-threshold 1024"
    # vLLM serves exactly one model name. Every alias below is rewritten to it, so
    # the backend never sees an unknown model.
    useModelName: "qwen3.8-flash-next"
    # Request profiles (issue #9): one model-id alias per consumer class. llama-swap
    # stamps these fields into the request body for that alias. Plain keys are
    # ENFORCED (a client cannot override them); keys ending in "?" are defaults a
    # client may override. priority: lower = scheduled sooner (only matters when
    # the 8 slots are full or KV is short - see docs/mixed-workload-plan.md).
    # Changing this block is a ~13-minute model reload.
    filters:
      setParamsByID:
        # latency-sensitive periodic clients with hard timeouts (tiny calls)
        "qwen3.8-flash-next-dashboard":
          priority: -10
        # interactive tool-calling assistant: a human is waiting on a multi-step
        # loop, so hybrid thinking is OFF and answers are kept short
        "qwen3.8-flash-next-assistant":
          priority: -5
          chat_template_kwargs:
            enable_thinking: false
          max_tokens?: 2048
          temperature?: 0.2
        # same consumer, hard questions: thinking ON, longer answers
        "qwen3.8-flash-next-assistant-deep":
          priority: -5
          chat_template_kwargs:
            enable_thinking: true
          max_tokens?: 4096
        # human chat UI
        "qwen3.8-flash-next-chat":
          priority: -5
        # background / unattended work yields to everything else
        "qwen3.8-flash-next-batch":
          priority: 10

# No group: with one model there is nothing to swap between, and an exclusive
# group would only add a way for it to get unloaded.

hooks:
  on_startup:
    preload:
      - "qwen3.8-flash-next"
